    ResolveReconciliationBreakResponse:
      type: object
      required:
        - break_id
        - status
        - resolution_action
        - resolved_at
      properties:
        break_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ReconciliationBreakStatus'
        resolution_action:
          $ref: '#/components/schemas/BreakResolutionAction'
        resolution_journal_entry_id:
          type: string
          format: uuid
          description: Double-entry ledger journal entry ID posted to balance the variance.
        settlement_batch_status:
          type: string
          description: Updated status of associated settlement batch (e.g. UNBLOCKED, SETTLED).
          example: "UNBLOCKED"
        resolved_at:
          type: string
          format: date-time
