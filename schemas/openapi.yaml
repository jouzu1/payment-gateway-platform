          format: uri
          description: A URI reference identifying the problem type.
          example: "https://errors.gateway.platform.internal/idempotency-conflict"
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: "Idempotency Conflict"
        status:
          type: integer
          description: The HTTP status code generated by origin server.
          example: 409
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
          example: "A concurrent request with this Idempotency-Key is currently in-flight."
        instance:
          type: string
          description: A URI reference identifying the specific occurrence of the problem.
          example: "/v1/payment_intents/pi_018b1234-abcd-7000-8000-000000000001"
        code:
          type: string
          description: Platform machine-readable error code.
          example: "IDEMPOTENCY_IN_FLIGHT"
        invalid_params:
          type: array
          description: Detailed validation failures per request field.
          items:
            type: object
            required:
              - name
              - reason
            properties:
              name:
                type: string
                example: "amount"
              reason:
                type: string
                example: "Must be a positive integer minor currency unit"

