openapi: 3.1.0
info:
  title: Enterprise Payment Gateway Platform API
  version: 1.0.0
  description: >
    Tier-1 Real-Time Payment Gateway Platform specification providing unified APIs
    for Card & Alternative Payins, Domestic Instant Remittance, Cross-Border Payouts,
    P2P Lending FBO Escrow, and Double-Entry Ledger operations.
servers:
  - url: https://api.gateway.platform.internal/v1
    description: Production Gateway Cluster
  - url: https://sandbox.api.gateway.platform.internal/v1
    description: Sandbox Sandbox Environment
security:
  - BearerAuth: []

paths:
  /v1/payment_intents:
    post:
      summary: Create a PaymentIntent
      description: Initiates a payment collection session with cryptographic idempotency locking.
      operationId: createPaymentIntent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentIntentRequest'
      responses:
        '201':
          description: PaymentIntent successfully initialized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/IdempotencyConflictError'
    get:
      summary: List PaymentIntents
      description: Retrieve paginated payment intents for the authenticated merchant.
      operationId: listPaymentIntents
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PaymentIntentStatus'
      responses:
        '200':
          description: Paginated list of PaymentIntents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentIntent'
                  has_more:
                    type: boolean

  /v1/payment_intents/{id}:
    get:
      summary: Retrieve a PaymentIntent
      operationId: getPaymentIntent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: PaymentIntent details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /v1/payment_intents/{id}/confirm:
    post:
      summary: Confirm a PaymentIntent
      description: Confirms payment method details, executes 3DS2 or redirects, and attempts payment authorization.
      operationId: confirmPaymentIntent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentIntentRequest'
      responses:
        '200':
          description: PaymentIntent confirmation processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '402':
          $ref: '#/components/responses/PaymentDeclinedError'

  /v1/payment_intents/{id}/capture:
    post:
      summary: Capture a PaymentIntent
      description: Finalizes and settles an authorized two-message payment transaction.
      operationId: capturePaymentIntent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_to_capture:
                  type: integer
                  description: Optional partial capture amount in minor units.
      responses:
        '200':
          description: Payment successfully captured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'

  /v1/payment_intents/{id}/cancel:
    post:
      summary: Cancel a PaymentIntent
      operationId: cancelPaymentIntent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: PaymentIntent cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'

  /v1/refunds:
    post:
      summary: Create a Refund
      operationId: createRefund
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefundRequest'
      responses:
        '201':
          description: Refund accepted and dispatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'

  /v1/payouts:
    post:
      summary: Dispatch a Payout Order
      description: Initiates an instant domestic remittance or cross-border payment instruction.
      operationId: createPayoutOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayoutOrderRequest'
      responses:
        '201':
          description: Payout order created and routed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutOrder'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /v1/payouts/{id}:
    get:
      summary: Retrieve Payout Status
      operationId: getPayoutOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payout order details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutOrder'

  /v1/payouts/validate-beneficiary:
    post:
      summary: Probe and Validate Beneficiary Account
      description: Executes real-time domestic rail account inquiry to verify beneficiary account ownership.
      operationId: validateBeneficiary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateBeneficiaryRequest'
      responses:
        '200':
          description: Beneficiary probe completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryValidationResult'

  /v1/payouts/quotes:
    post:
      summary: Lock Guaranteed FX Quote
      description: Obtains a binding foreign exchange rate quote with a deterministic 60-second TTL.
      operationId: createFXQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFXQuoteRequest'
      responses:
        '201':
          description: Guaranteed quote locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FXQuote'

  /v1/p2p/loans:
    post:
      summary: Originate P2P Loan Contract
      description: Creates loan contract tied to Custodian Bank FBO Escrow account.
      operationId: originateLoan
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OriginateLoanRequest'
      responses:
        '201':
          description: Loan originated and ready for funding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanAccount'

  /v1/p2p/loans/{id}/disburse:
    post:
      summary: Disburse Loan from Escrow
      description: Verifies 100% investor pooling and triggers disbursement payout to borrower bank account.
      operationId: disburseLoan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Disbursement initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanAccount'

  /v1/p2p/loans/{id}/repay:
    post:
      summary: Process Repayment Collection and Waterfall Split
      description: Collects borrower installment payment into Escrow and executes atomic mathematical waterfall split.
      operationId: processLoanRepayment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessLoanRepaymentRequest'
      responses:
        '200':
          description: Repayment collected and waterfall splits committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepaymentWaterfallResult'

  /v1/ledger/accounts:
    post:
      summary: Create Ledger Account
      operationId: createLedgerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLedgerAccountRequest'
      responses:
        '201':
          description: Account created in Chart of Accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAccount'

  /v1/ledger/accounts/{id}/balance:
    get:
      summary: Get Real-Time Account Balance
      operationId: getAccountBalance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Real-time balance snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalanceSnapshot'

  /v1/ledger/journals:
    post:
      summary: Post Balanced Double-Entry Journal Entry
      description: Atomic multi-leg journal posting enforcing Debits == Credits zero-sum invariant.
      operationId: postJournalEntry
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostJournalEntryRequest'
      responses:
        '201':
          description: Journal entry committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryReceipt'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /v1/webhooks/endpoints:
    post:
      summary: Register Webhook Endpoint
      operationId: registerWebhookEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterWebhookRequest'
      responses:
        '201':
          description: Webhook endpoint registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'

  /v1/reconciliation/statements:
    post:
      summary: Upload Clearing Statement File
      description: Ingests external bank or network statement file (ISO 20022 camt.053 XML, SWIFT MT940, BAI2, NACHA, CSV) with cryptographic verification.
      operationId: uploadClearingStatement
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - statement_format
                - rail_code
                - statement_date
              properties:
                file:
                  type: string
                  format: binary
                  description: Binary or text content of the bank clearing statement.
                statement_format:
                  $ref: '#/components/schemas/StatementFormat'
                rail_code:
                  type: string
                  example: "BI_FAST"
                bank_code:
                  type: string
                  example: "BCA_ID"
                account_number:
                  type: string
                  example: "0082710399"
                statement_date:
                  type: string
                  format: date
                  example: "2026-11-10"
          application/json:
            schema:
              $ref: '#/components/schemas/UploadClearingStatementRequest'
      responses:
        '201':
          description: Statement successfully ingested and queued for parsing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearingStatement'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/IdempotencyConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
    get:
      summary: List Clearing Statements
      description: Retrieves paginated clearing statements filtered by rail and date.
      operationId: listClearingStatements
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - name: rail_code
          in: query
          schema:
            type: string
        - name: bank_code
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StatementStatus'
        - name: from_date
          in: query
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Paginated list of clearing statements.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClearingStatement'
                  has_more:
                    type: boolean

  /v1/reconciliation/statements/{id}:
    get:
      summary: Retrieve Clearing Statement Details
      description: Retrieves metadata, balance summary, line counts, and parsing status for a specific clearing statement.
      operationId: getClearingStatement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Clearing statement details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearingStatement'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /v1/reconciliation/statements/{id}/lines:
    get:
      summary: List Statement Lines
      description: Retrieves paginated individual normalized statement lines for an ingested statement.
      operationId: listStatementLines
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - name: reconciliation_status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of statement lines.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StatementLine'
                  has_more:
                    type: boolean
        '404':
          $ref: '#/components/responses/NotFoundError'

  /v1/reconciliation/runs:
    post:
      summary: Trigger Reconciliation Run
      description: Initiates automated matching across internal transactions, ledger journal entries, and clearing statements.
      operationId: triggerReconciliationRun
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerReconciliationRunRequest'
      responses:
        '202':
          description: Reconciliation run accepted and processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationRun'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/IdempotencyConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
    get:
      summary: List Reconciliation Runs
      description: Retrieves paginated reconciliation runs filtered by status or topology.
      operationId: listReconciliationRuns
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReconciliationRunStatus'
        - name: topology
          in: query
          schema:
            $ref: '#/components/schemas/ReconciliationTopology'
        - name: rail_code
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated reconciliation runs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReconciliationRun'
                  has_more:
                    type: boolean

  /v1/reconciliation/runs/{id}:
    get:
      summary: Retrieve Reconciliation Run Status & Audit Summary
      description: Returns run execution metrics, total matched/break counts, volumes, and cryptographic audit sign-off.
      operationId: getReconciliationRun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Run details and audit summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationRunDetail'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /v1/reconciliation/runs/{id}/matches:
    get:
      summary: List Matched Records for Run
      description: Retrieves paginated matched transaction associations and confidence scores.
      operationId: listReconciliationMatches
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - name: match_status
          in: query
          schema:
            $ref: '#/components/schemas/ReconciliationMatchStatus'
      responses:
        '200':
          description: Paginated matched transaction records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReconciliationMatch'
                  has_more:
                    type: boolean
        '404':
          $ref: '#/components/responses/NotFoundError'

  /v1/reconciliation/breaks:
    get:
      summary: List Reconciliation Breaks
      description: Query open and resolved reconciliation breaks filtered by run, settlement batch, or break class.
      operationId: listReconciliationBreaks
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - name: run_id
          in: query
          schema:
            type: string
            format: uuid
        - name: settlement_batch_id
          in: query
          schema:
            type: string
            format: uuid
        - name: break_class
          in: query
          schema:
            $ref: '#/components/schemas/ReconciliationBreakClass'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReconciliationBreakStatus'
      responses:
        '200':
          description: Paginated list of reconciliation breaks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReconciliationBreak'
                  has_more:
                    type: boolean

  /v1/reconciliation/breaks/{id}:
    get:
      summary: Inspect Reconciliation Break
      description: Detailed breakdown of reconciliation discrepancies and linked records.
      operationId: getReconciliationBreak
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Break inspection details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationBreakDetail'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /v1/reconciliation/breaks/{id}/resolve:
    post:
      summary: Resolve Reconciliation Break
      description: Applies deterministic resolution to an open break (variance write-off to 510000, force match, retry, transit hold).
      operationId: resolveReconciliationBreak
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveReconciliationBreakRequest'
      responses:
        '200':
          description: Break resolved and linked ledger journal entry generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveReconciliationBreakResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique UUIDv4 token guaranteeing exactly-once transactional semantics.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    StartingAfter:
      name: starting_after
      in: query
      schema:
        type: string
        format: uuid

  responses:
    BadRequestError:
      description: Invalid request payload or parameter validation failure (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnauthorizedError:
      description: Missing, invalid, or expired authentication credentials (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ForbiddenError:
      description: Action forbidden by policy, permission scope, or sanctions screening (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFoundError:
      description: Requested entity or resource not found (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    IdempotencyConflictError:
      description: Concurrent request in flight or conflicting state for this Idempotency-Key (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableEntityError:
      description: Business logic validation failure or idempotent payload mutation (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: Internal gateway failure or unhandled server error (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PaymentDeclinedError:
      description: Card or payment authorization was declined by issuer or payment rail (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    PaymentIntentStatus:
      type: string
      enum:
        - REQUIRES_PAYMENT_METHOD
        - REQUIRES_CONFIRMATION
        - REQUIRES_ACTION
        - PROCESSING
        - SUCCEEDED
        - CANCELLED

    CreatePaymentIntentRequest:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          description: Amount in minor currency units (e.g., 10000 for $100.00 USD).
          example: 10000
        currency:
          type: string
          description: ISO 4217 three-letter currency code.
          example: USD
        customer_id:
          type: string
          format: uuid
        capture_method:
          type: string
          enum: [AUTOMATIC, MANUAL]
          default: AUTOMATIC
        allowed_payment_methods:
          type: array
          items:
            type: string
          example: ["CARD", "VA_BCA", "QRIS"]
        description:
          type: string
          example: "Order #8491 - Luxury Watch"
        metadata:
          type: object
          additionalProperties: true

    PaymentIntent:
      type: object
      required:
        - id
        - amount
        - currency
        - status
        - client_secret
        - created_at
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: integer
          example: 10000
        currency:
          type: string
          example: USD
        status:
          $ref: '#/components/schemas/PaymentIntentStatus'
        client_secret:
          type: string
          example: "pi_secret_8df72b9a7f"
        capture_method:
          type: string
          example: "AUTOMATIC"
